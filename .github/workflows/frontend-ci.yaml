name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        working-directory: starter/frontend
        run: npm ci
      - name: Run linter
        working-directory: starter/frontend
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
